{% extends 'base.html' %}

{% block content %}
<h2>Patients</h2>

<a href="/patients/add/">+ Add Patient</a>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Age</th>
    </tr>

    {% for patient in patients %}
    <tr>
        <td>{{ patient.id }}</td>
        <td>{{ patient.first_name }} {{ patient.last_name }}</td>
        <td>{{ patient.phone }}</td>
        <td>{{ patient.age }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
